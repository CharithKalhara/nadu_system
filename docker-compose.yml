
services:
  app:
    build:
      context: .
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    networks:
      - laravel
    volumes:
      - laravel_storage:/var/www/html/storage

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "9000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - laravel_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - laravel

networks:
  laravel:

volumes:
  laravel_storage:
