<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nadu System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #111827;
        }

        .container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #ffffff;
            text-align: center;
        }

        .loader {
            width: 34px;
            height: 34px;
            margin: 0 auto 16px;
            border: 4px solid #e5e7eb;
            border-top-color: #f59e0b;
            border-radius: 50%;
            animation: loader-spin 0.85s linear infinite;
        }

        @keyframes loader-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">
            <div class="loader" aria-hidden="true"></div>
        <h1>Nadu System</h1>
            <p>Loading Nadu System...</p>
    </div>
</div>

</body>
</html>
